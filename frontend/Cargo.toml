[package]
name = "hailango-frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hailango-frontend"
path = "src/main.rs"

[dependencies]
# Leptos for reactive WASM UI
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }

# WASM essentials
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "console",
    "SubmitEvent",
    "Storage",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Location",
] }
js-sys = "0.3"

# Logging for WASM
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for WASM
gloo-net = "0.6"
gloo-storage = "0.3"
gloo-timers = "0.3"
