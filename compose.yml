# HaiLanGo - Docker/Podman Compose Configuration
# ==============================================
#
# Usage:
#   Full stack:    docker compose up -d
#   Stop:          docker compose down
#   Logs:          docker compose logs -f
#
# Podman users:
#   podman-compose up -d
#
# Google Cloud Vision API Setup:
#   1. Create a Service Account (NOT OAuth 2.0 Client ID!)
#   2. Download the JSON key file
#   3. Set GOOGLE_APPLICATION_CREDENTIALS in .env to the path
#   Example: GOOGLE_APPLICATION_CREDENTIALS=./credentials/google-service-account.json
#
# Qwen-TTS (GPU required):
#   Set ENABLE_QWEN_TTS=true in .env to enable local TTS
#   Requires NVIDIA GPU with CUDA support

services:
  # ===========================================
  # Database Services (default)
  # ===========================================

  # PostgreSQL Database
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: hailango-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-HaiLanGo_dev}
      POSTGRES_USER: ${POSTGRES_USER:-HaiLanGo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-HaiLanGo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: hailango-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # Application Services
  # ===========================================

  # Backend (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hailango-backend
    environment:
      # Application
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-HaiLanGo}
      DEBUG: ${DEBUG:-true}

      # Server
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-HaiLanGo}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-HaiLanGo_dev}

      # Redis
      REDIS_URL: redis://redis:6379

      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}

      # Mock APIs
      USE_MOCK_APIS: ${USE_MOCK_APIS:-false}
      MOCK_DATA_DIR: ${MOCK_DATA_DIR:-./mocks/data}

      # OCR
      OCR_PROVIDER: ${OCR_PROVIDER:-google_vision}
      GOOGLE_CLOUD_VISION_API_KEY: ${GOOGLE_CLOUD_VISION_API_KEY:-}
      AZURE_COMPUTER_VISION_ENDPOINT: ${AZURE_COMPUTER_VISION_ENDPOINT:-}
      AZURE_COMPUTER_VISION_API_KEY: ${AZURE_COMPUTER_VISION_API_KEY:-}

      # Google Cloud APIs (Service Account JSON)
      # IMPORTANT: Use Service Account, NOT OAuth 2.0 Client ID!
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/google-service-account.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_REGION: ${GOOGLE_CLOUD_REGION:-}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
      GOOGLE_CLOUD_TTS_API_KEY: ${GOOGLE_CLOUD_TTS_API_KEY:-}
      GOOGLE_CLOUD_STT_API_KEY: ${GOOGLE_CLOUD_STT_API_KEY:-}
      GOOGLE_CLOUD_TRANSLATE_API_KEY: ${GOOGLE_CLOUD_TRANSLATE_API_KEY:-}

      # TTS Provider (azure, google, edge, qwen)
      TTS_PROVIDER: ${TTS_PROVIDER:-azure}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-eastasia}

      # Qwen-TTS (local GPU-based TTS)
      QWEN_TTS_URL: ${QWEN_TTS_URL:-http://qwen-tts:8000}
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./mocks:/app/mocks
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      # Google Cloud Service Account credentials
      - ${GOOGLE_CREDENTIALS_PATH:-./credentials}:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: hailango-frontend
    environment:
      # Next.js
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_USE_MOCK_APIS: ${USE_MOCK_APIS:-false}

      # Server
      PORT: ${FRONTEND_PORT:-3000}
      HOSTNAME: ${SERVER_HOST:-0.0.0.0}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ===========================================
  # Qwen-TTS (Local GPU-based TTS Service)
  # ===========================================
  # Requires NVIDIA GPU with CUDA support
  # Set ENABLE_QWEN_TTS=true in .env to enable
  # Supported languages: Chinese, English, Japanese, Korean, German, French, Russian, Portuguese, Spanish, Italian
  qwen-tts:
    build:
      context: ./services/qwen-tts
      dockerfile: Dockerfile
    container_name: hailango-qwen-tts
    environment:
      # Model selection (0.6B or 1.7B)
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      # Device configuration
      DEVICE: cuda:0
      DTYPE: bfloat16
    ports:
      - "${QWEN_TTS_PORT:-8001}:8000"
    volumes:
      # Model cache directory
      - qwen_tts_models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Only start if ENABLE_QWEN_TTS=true
    profiles:
      - qwen-tts
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  qwen_tts_models:
    driver: local
