[package]
name = "hailango"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
# Reinhardt framework (full-stack Rust framework)
# Note: auth and redis-backend have bugs in alpha, using direct implementations
reinhardt = { version = "0.1.0-alpha.1", package = "reinhardt-web", default-features = false, features = [
    "standard",
    "conf",
    "database",
    "db-postgres",
    "pages",
    "i18n",
    "websockets",
    "openapi",
    "middleware-cors",
    "middleware-rate-limit",
    "mail",
    "tasks"
] }

# Redis client (workaround for reinhardt redis-backend alpha bug)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# JWT authentication (workaround for reinhardt-auth alpha bug)
jsonwebtoken = "9"

# SQLx for direct database access (supplement to reinhardt-db)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

# Bytes (for Reinhardt Request/Response bodies)
bytes = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# Password hashing
argon2 = { version = "0.5", features = ["std"] }

# Async trait support
async-trait = "0.1"

# HTTP client for external APIs
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
base64 = "0.22"

# WASM-specific dependencies (conditional)
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "console", "SubmitEvent"] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = "0.3"

[dev-dependencies]
reinhardt-test = "=0.1.0-alpha.4"
tokio-test = "0.4"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }

[[bin]]
name = "manage"
path = "src/bin/manage.rs"

[[bin]]
name = "hailango-frontend"
path = "src/bin/frontend.rs"
